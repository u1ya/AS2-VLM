<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AS2 Navigation Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#202629;font:15px system-ui,sans-serif;letter-spacing:0}header{padding:20px 28px;background:#fff;border-bottom:1px solid #d9dfe2;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:22px;margin:0}small{color:#667479}.badge{color:#16715b;font-size:13px}main{max-width:1240px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}canvas{width:100%;aspect-ratio:4/3;display:block;background:#e5ecee;border:1px solid #bdcbcf;border-radius:6px}aside{min-width:0}label{display:block;font-size:13px;color:#536066;margin:0 0 8px}textarea{width:100%;resize:vertical;min-height:94px;padding:12px;font:inherit;border:1px solid #b7c4c8;border-radius:5px;background:white}button,select{font:inherit;border:1px solid #bac6ca;background:white;border-radius:5px;padding:9px 12px;cursor:pointer}button:hover{background:#e9eff0}button:disabled{opacity:.5;cursor:wait}.primary{background:#13735d;color:white;border-color:#13735d}.primary:hover{background:#0d5e4b}.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}.row button{flex:1}h2{font-size:15px;margin:24px 0 12px}.presets{display:grid;gap:7px}.presets button{text-align:left;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5;background:#e8eeef;padding:12px;border-radius:5px;min-height:120px}.status{margin-top:12px;font-size:14px;min-height:42px}.metrics{display:flex;justify-content:space-between;font:13px ui-monospace,monospace;margin-top:12px;gap:8px;flex-wrap:wrap}input[type=checkbox]{accent-color:#13735d}footer{padding:0 24px 24px;max-width:1240px;margin:auto;color:#65747b;font-size:12px}@media(max-width:780px){main{grid-template-columns:1fr;padding:14px;gap:18px}header{padding:16px;align-items:flex-start}h1{font-size:19px}header small{display:block}aside{display:grid;grid-template-columns:1fr}canvas{aspect-ratio:4/3}footer{padding:0 14px 16px}}
</style>
<header><div><h1>AS2 Navigation Lab</h1><small>Кинематическая симуляция</small></div><span class="badge">● Робот не подключён</span></header>
<main><section><canvas id="scene" width="960" height="720" aria-label="Карта комнаты и виртуальный робот"></canvas><div class="metrics"><span id="position">x 1.30 · y 1.20 · yaw 0°</span><span id="step">Ожидание</span></div><div class="status" id="status" role="status">Готово</div></section>
<aside><label for="instruction">Команда</label><textarea id="instruction">Повернись к двери и подойди к ней</textarea><div class="row"><select id="backend" aria-label="Планировщик"><option value="ollama">Qwen2.5-VL 3B</option><option value="rules">Правила · без модели</option></select><select id="speed" aria-label="Скорость"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select></div><div class="row"><button id="run" class="primary">▶ Выполнить</button><button id="stop" title="Остановить" aria-label="Остановить">■</button><button id="reset" title="Сбросить позицию" aria-label="Сбросить позицию">↺</button></div><label><input type="checkbox" id="obstacle"> Препятствие в центре</label>
<h2>Сценарии</h2><div class="presets"><button>Дойди до белой стены</button><button>Дойди до двери</button><button>Оглянись вокруг</button><button>Повернись в сторону мужчины</button><button>Повернись налево и пройди вперед на метр</button></div><h2>План действий</h2><pre id="plan">—</pre></aside></main>
<footer>Восприятие: известная карта · Контроллер: геометрический · Физика ног: отсутствует</footer>
<script>
const $=id=>document.getElementById(id),ctx=$('scene').getContext('2d');let world,pose=[1.3,1.2,0],trail=[],generation=0,busy=false;
const names={face_target:'Поворот к цели',approach_target:'Подход к цели',turn_relative:'Поворот',walk_distance:'Ходьба',look_around:'Осмотр',stop:'Остановка',idle:'Ожидание'};
function draw(){if(!world)return;const c=$('scene'),s=100,ox=80,oy=60;ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.translate(ox,oy);ctx.fillStyle='#f9fcfc';ctx.fillRect(0,0,800,600);ctx.strokeStyle='#e2eaec';ctx.lineWidth=1;for(let i=0;i<=8;i++){ctx.beginPath();ctx.moveTo(i*s,0);ctx.lineTo(i*s,600);ctx.stroke()}for(let i=0;i<=6;i++){ctx.beginPath();ctx.moveTo(0,i*s);ctx.lineTo(800,i*s);ctx.stroke()}ctx.strokeStyle='#8b9fa6';ctx.lineWidth=7;ctx.strokeRect(0,0,800,600);ctx.strokeStyle='white';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(240,0);ctx.lineTo(560,0);ctx.stroke();ctx.fillStyle='#43575f';ctx.font='18px system-ui';ctx.textAlign='center';ctx.fillText('БЕЛАЯ СТЕНА',400,-20);
ctx.fillStyle='#ce9a50';ctx.fillRect(733,64,62,112);ctx.fillStyle='#5e431f';ctx.fillText('Дверь',735,202);ctx.fillStyle='#995e90';ctx.beginPath();ctx.arc(140,130,15,0,Math.PI*2);ctx.fill();ctx.fillRect(124,151,32,40);ctx.fillStyle='#674662';ctx.fillText('Мужчина',140,224);
if($('obstacle').checked){ctx.fillStyle='#8d9b9f';ctx.fillRect(320,260,140,90);ctx.fillStyle='#fff';ctx.fillText('Блок',390,314)}ctx.strokeStyle='#258cba';ctx.lineWidth=3;ctx.beginPath();trail.forEach((p,i)=>{i?ctx.lineTo(p[0]*s,(6-p[1])*s):ctx.moveTo(p[0]*s,(6-p[1])*s)});ctx.stroke();ctx.save();ctx.translate(pose[0]*s,(6-pose[1])*s);ctx.rotate(-pose[2]);ctx.fillStyle='#203b41';for(const y of [-23,15])for(const x of [-20,12])ctx.fillRect(x,y,10,8);ctx.fillStyle='#1b9e80';ctx.fillRect(-23,-15,46,30);ctx.fillStyle='#173a3c';ctx.fillRect(19,-11,15,22);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-4,-7);ctx.lineTo(-4,7);ctx.closePath();ctx.fill();ctx.restore();ctx.restore();$('position').textContent=`x ${pose[0].toFixed(2)} · y ${pose[1].toFixed(2)} · yaw ${Math.round(pose[2]*180/Math.PI)}°`}
function cancel(message){generation++;busy=false;$('run').disabled=false;$('obstacle').disabled=false;$('status').textContent=message}
$('stop').onclick=()=>cancel('Остановлено пользователем');$('reset').onclick=()=>{cancel('Готово');pose=world.start.slice();trail=[];$('step').textContent='Ожидание';draw()};$('obstacle').onchange=()=>{$('reset').click()};document.querySelectorAll('.presets button').forEach(b=>b.onclick=()=>{$('instruction').value=b.textContent});
$('run').onclick=async()=>{if(busy)return;const token=++generation;busy=true;$('run').disabled=true;$('obstacle').disabled=true;$('status').textContent='Планирование…';try{const response=await fetch('/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction:$('instruction').value,backend:$('backend').value,pose,obstacle:$('obstacle').checked})});const data=await response.json();if(token!==generation)return;if(!response.ok)throw Error(data.error);$('plan').textContent=JSON.stringify(data.plan.steps,null,2);$('status').textContent='Выполнение';let index=0,last=performance.now(),acc=0;function tick(now){if(token!==generation)return;acc+=(now-last)*Number($('speed').value);last=now;while(acc>=50&&index<data.frames.length){const f=data.frames[index++];pose=f.pose;trail.push(pose.slice());$('step').textContent=`${f.step}/​${data.plan.steps.length} · ${names[f.skill]}`;acc-=50}draw();if(index<data.frames.length)requestAnimationFrame(tick);else{busy=false;$('run').disabled=false;$('obstacle').disabled=false;$('status').textContent=({completed:'Завершено',blocked:'Препятствие: безопасная остановка',stopped:'Остановлено'})[data.status]}}requestAnimationFrame(tick)}catch(e){if(token===generation)cancel('Ошибка: '+e.message)}};
fetch('/world').then(r=>r.json()).then(w=>{world=w;pose=w.start.slice();draw()}).catch(e=>$('status').textContent=e.message);
</script></html>
