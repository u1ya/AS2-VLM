[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "as2-vlm"
version = "0.1.0"
description = "AS2 language control prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = ["Pillow>=10,<13"]
agent = ["pydantic>=2.7,<3", "Pillow>=10,<13"]
robot = ["unitree_sdk2py", "opencv-python>=4.8"]

[tool.setuptools.packages.find]
include = ["as2_vlm*"]

[tool.setuptools.package-data]
"as2_vlm.agent" = ["static/*.html"]
